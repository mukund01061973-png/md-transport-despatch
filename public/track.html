<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MD Transport • Live Ride Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background:#0f172a; color:#f8fafc; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        #map { flex:1; width:100%; z-index: 1; }
        .trip-sheet { background:#1e293b; border-top:1px solid #334155; padding:16px 20px; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,0.5); z-index:1000; }
        .status-pill { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:bold; margin-bottom:8px; }
        .status-offered { background:#facc15; color:#78350f; }
        .status-accepted { background:#38bdf8; color:#0c4a6e; }
        .status-arrived { background:#a855f7; color:#3b0764; }
        .status-pob { background:#f97316; color:#7c2d12; }
        .status-completed { background:#22c55e; color:#052e16; }
        .status-cancelled { background:#ef4444; color:#fff; }
        .driver-info { display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #334155; padding-top:10px; font-size: 0.9rem; }
        .btn-cancel { background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; font-size:0.8rem; cursor:pointer; margin-top:10px; width:100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="trip-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="tripStatusPill" class="status-pill status-accepted">Loading...</span>
            <span id="jobRef" style="font-size:0.75rem; color:#94a3b8;">#track.html</span>
        </div>
        <div id="jobDetails" style="font-size:0.9rem; margin:8px 0;">
            <div id="pickupText">📍 <strong>Pickup:</strong> Loading...</div>
            <div id="dropoffText" style="margin-top:4px;">🏁 <strong>Destination:</strong> Loading...</div>
        </div>
        <div class="driver-info">
            <div>
                <strong id="driverName">Finding driver...</strong><br>
                <span id="carDetails" style="font-size:0.75rem; color:#94a3b8;">MD Transport Fleet</span>
            </div>
            <div id="fareDisplay" style="font-weight:bold; color:#38bdf8; font-size:1.1rem;">£0.00</div>
        </div>
        <button id="cancelBookingBtn" class="btn-cancel" onclick="cancelCurrentBooking()" style="display:none;">Cancel Booking</button>
    </div>

    <script>
        const map = L.map('map').setView([51.3813, -2.3599], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = null;
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get("jobId");

        function fetchJobDetails() {
            if (!jobId) {
                document.getElementById("tripStatusPill").textContent = "INVALID LINK";
                document.getElementById("pickupText").innerHTML = "📍 <strong>Error:</strong> No Job ID specified.";
                return;
            }
            fetch("/api/track/" + jobId)
                .then(res => {
                    if (!res.ok) throw new Error("Trip not found");
                    return res.json();
                })
                .then(data => {
                    updateUI(data.job, data.driver);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById("tripStatusPill").textContent = "NOT FOUND";
                    document.getElementById("pickupText").innerHTML = "📍 <strong>Booking not found or completed</strong>";
                });
        }

        function updateUI(job, driver) {
            window.currentJob = job;
            document.getElementById("jobRef").textContent = "#" + job.id;
            
            const pill = document.getElementById("tripStatusPill");
            const status = (job.status || "PENDING").toLowerCase();
            pill.textContent = job.status || "PENDING";
            pill.className = "status-pill status-" + status;

            document.getElementById("pickupText").innerHTML = "📍 <strong>Pickup:</strong> " + (job.pickup || "Not specified");
            document.getElementById("dropoffText").innerHTML = "🏁 <strong>Destination:</strong> " + (job.dropoff || "Not specified");
            
            if (driver && driver.name) {
                document.getElementById("driverName").textContent = "Driver: " + driver.name;
                document.getElementById("carDetails").textContent = (driver.vehicle || "Vehicle") + " (" + (driver.vehicleClass || "") + ")";
            } else if (job.assignedDriverId && job.assignedDriverId !== 'UNASSIGNED') {
                document.getElementById("driverName").textContent = "Driver: " + job.assignedDriverId;
                document.getElementById("carDetails").textContent = "MD Transport Fleet";
            } else {
                document.getElementById("driverName").textContent = "Finding driver...";
                document.getElementById("carDetails").textContent = "MD Transport Fleet";
            }

            document.getElementById("fareDisplay").textContent = "£" + (Number(job.fare || 0).toFixed(2));

            const cancelBtn = document.getElementById("cancelBookingBtn");
            if (!job.assignedDriverId || job.assignedDriverId === 'UNASSIGNED' || job.status === "UNASSIGNED" || job.status === "PENDING" || job.status === "BID_BOARD") {
                cancelBtn.style.display = "block";
            } else {
                cancelBtn.style.display = "none";
            }

            let lat = (driver && driver.lat) ? driver.lat : job.lat;
            let lng = (driver && driver.lng) ? driver.lng : job.lng;
            if (lat && lng) {
                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map);
                } else {
                    marker.setLatLng([lat, lng]);
                }
                map.setView([lat, lng], 15);
            }
        }

        fetchJobDetails();
        setInterval(fetchJobDetails, 3000);

        if (typeof io !== "undefined") {
            const socket = io();
            socket.on("admin_state", (state) => {
                if (state && state.jobs) {
                    let job = state.jobs.find(j => j.id === jobId);
                    if (job) {
                        // Re-fetch track info to get driver details too
                        fetchJobDetails();
                    }
                }
            });
        }

        function cancelCurrentBooking() {
            if (!jobId) return;
            if (confirm("Are you sure you want to cancel this booking?")) {
                fetch("/api/jobs/" + jobId + "/cancel", { method: "POST" })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            alert("Booking successfully cancelled.");
                            location.reload();
                        } else {
                            alert("Could not cancel: " + (data.error || "Job may already be in progress."));
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Error connecting to server.");
                    });
            }
        }
    </script>
</body>
</html>
