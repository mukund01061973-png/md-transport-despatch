<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MD Transport • Live Ride Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background:#0f172a; color:#f8fafc; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        #map { flex:1; width:100%; }
        .trip-sheet { background:#1e293b; border-top:1px solid #334155; padding:16px 20px; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,0.5); z-index:1000; }
        .status-pill { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:bold; margin-bottom:8px; }
        .status-offered { background:#facc15; color:#78350f; }
        .status-accepted { background:#38bdf8; color:#0c4a6e; }
        .status-arrived { background:#a855f7; color:#3b0764; }
        .status-pob { background:#f97316; color:#7c2d12; }
        .status-completed { background:#22c55e; color:#052e16; }
        .driver-info { display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #334155; padding-top:10px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="trip-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="tripStatusPill" class="status-pill status-accepted">Driver Assigned</span>
            <span id="tripFare" style="font-size:1.1rem; font-weight:bold; color:#4ade80;">£0.00</span>
        </div>
        <h2 id="tripHeadline" style="font-size:1.05rem; margin-bottom:6px;">Your driver is en route</h2>
        <div style="font-size:0.8rem; color:#94a3b8; display:flex; flex-direction:column; gap:4px;">
            <div>📍 <strong>Pickup:</strong> <span id="tripPickup">-</span></div>
            <div>🏁 <strong>Destination:</strong> <span id="tripDropoff">-</span></div>
        </div>
        <div class="driver-info">
            <div>
                <div id="driverName" style="font-weight:bold; font-size:0.95rem; color:#38bdf8;">Driver Assigned</div>
                <div id="driverVehicle" style="font-size:0.75rem; color:#cbd5e1;">Skoda Octavia • Standard</div>
            </div>
            <div style="text-align:right;">
                <div style="font-size:0.75rem; color:#94a3b8;">Job Ref</div>
                <div id="jobRef" style="font-weight:bold; font-size:0.85rem;">-</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const pathParts = window.location.pathname.split("/");
        const jobId = pathParts[pathParts.length - 1];
        document.getElementById("jobRef").textContent = "#" + jobId;

        // Leaflet setup
        const map = L.map("map", { zoomControl:false }).setView([51.3811, -2.3590], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

        let driverMarker = null;
        const carIcon = L.divIcon({
            html: "<div style='font-size:24px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));'>🚖</div>",
            className: "car-icon",
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        // Request initial trip details
        fetch("/api/track/" + encodeURIComponent(jobId))
            .then(r => r.json())
            .then(job => {
                if (!job || !job.id) {
                    document.getElementById("tripHeadline").textContent = "Booking not found or completed";
                    return;
                }
                updateTripUI(job);
            });

        function updateTripUI(job) {
            document.getElementById("tripPickup").textContent = job.pickup || "-";
            document.getElementById("tripDropoff").textContent = job.dropoff || "-";
            document.getElementById("tripFare").textContent = "£" + Number(job.fare || 0).toFixed(2);
            document.getElementById("driverName").textContent = job.assignedDriverId || "Assigned Driver";

            const pill = document.getElementById("tripStatusPill");
            const headline = document.getElementById("tripHeadline");
            const st = (job.status || "Accepted").toUpperCase();

            if (st === "ACCEPTED") {
                pill.className = "status-pill status-accepted"; pill.textContent = "Driver En Route";
                headline.textContent = "Driver is on the way to your pickup.";
            } else if (st === "ARRIVED") {
                pill.className = "status-pill status-arrived"; pill.textContent = "Driver Arrived";
                headline.textContent = "Your driver is outside waiting!";
            } else if (st === "POB") {
                pill.className = "status-pill status-pob"; pill.textContent = "Trip in Progress";
                headline.textContent = "Passenger on board. En route to destination.";
            } else if (st === "COMPLETED") {
                pill.className = "status-pill status-completed"; pill.textContent = "Completed";
                headline.textContent = "Thank you for riding with MD Transport!";
            }
        }

        // Live location update from driver handset
        socket.on("driver_pos_broadcast", (pos) => {
            if (pos && pos.lat && pos.lng) {
                if (!driverMarker) {
                    driverMarker = L.marker([pos.lat, pos.lng], { icon: carIcon }).addTo(map);
                    map.setView([pos.lat, pos.lng], 15);
                } else {
                    driverMarker.setLatLng([pos.lat, pos.lng]);
                }
            }
        });

        socket.on("job_status_changed", (data) => {
            if (data.jobId === jobId) {
                fetch("/api/track/" + encodeURIComponent(jobId)).then(r => r.json()).then(updateTripUI);
            }
        });
    </script>
</body>
</html>
